services:
  symfony-db:
    image: mysql:8.0
    container_name: symfony-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD to the existing MySQL root password}
      MYSQL_DATABASE: ${DB_NAME:-app_db}
    ports:
      - "${DB_PORT:-3310}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - symfony-db-data:/var/lib/mysql
    networks:
      - platform-network

  symfony-pma:
    image: phpmyadmin
    container_name: symfony-pma
    restart: unless-stopped
    depends_on:
      symfony-db:
        condition: service_healthy
    environment:
      PMA_HOST: symfony-db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    networks:
      - platform-network

volumes:
  symfony-db-data:
    external: true
    name: symfony-db-data

networks:
  platform-network:
    external: true
    name: platform-network
