<!doctype html><html lang="en"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/admin/css/admin.css"><link rel="stylesheet" href="/css/message-modal.css"><body style="padding:24px"><script src="/js/message-modal.js"></script><h1>Confirmation verification</h1><form data-confirm="Are you sure you want to delete this product?" data-confirm-title="Delete Product" data-confirm-button="Delete"><input type="hidden" name="_token" value="test-only"><button class="btn" name="action" value="delete">Delete test product</button></form><button id="notice" class="btn">Show notice</button><output id="result">Submissions: 0</output><script>let count=0; document.addEventListener('submit',e=>{if(e.defaultPrevented)return;e.preventDefault();document.getElementById('result').textContent='Submissions: '+(++count)+'; token: '+new FormData(e.target).get('_token')+'; action: '+e.submitter.value;});document.getElementById('notice').onclick=()=>MaisonUngod.showAlert('Connection error');</script></body></html>
